    <meta http-equiv="X-Content-Type-Options" content="nosniff" />

    <!-- Google AdSense - Defer loading to improve initial page load -->
    <script async defer src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2176490979231754"
     crossorigin="anonymous"></script>
    
    <!-- Google tag (gtag.js) - Load after page render for better performance -->
    <script>
      // Load analytics after page load
      window.addEventListener('load', function() {
        setTimeout(function() {
          var script = document.createElement('script');
          script.async = true;
          script.src = 'https://www.googletagmanager.com/gtag/js?id=G-JDCPS7ENJ6';
          document.head.appendChild(script);
          
          script.onload = function() {
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-JDCPS7ENJ6');
            window.gtag = gtag;
          };
        }, 2000);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Single Page Apps for GitHub Pages
      // Restore the original URL from query parameter so React Router works correctly
      (function() {
        var l = window.location;
        var params = new URLSearchParams(l.search);
        var pathParam = params.get('p');
        
        if (pathParam) {
          var restoredPath = pathParam.startsWith('/') ? pathParam : '/' + pathParam;
          
          // Remove the 'p' parameter from URL
          params.delete('p');
          var newSearch = params.toString();
          var newUrl = restoredPath + (newSearch ? '?' + newSearch : '') + l.hash;
          
          // Restore the URL without reloading
          window.history.replaceState(null, null, newUrl);
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
