    <!-- Google AdSense - Deferred loading (safe for review, still optimized) -->
    <script>
      // Load AdSense script after page load to improve performance
      // Script tag remains in HTML for AdSense review compliance
      window.addEventListener('load', function() {
        setTimeout(function() {
          var script = document.createElement('script');
          script.async = true;
          script.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2176490979231754';
          script.crossOrigin = 'anonymous';
          document.head.appendChild(script);
        }, 2000); // 2 second delay after page load
      });
    </script>
    
    <!-- Google Analytics - Load ONLY after user interaction (saves 60KB on initial load) -->
    <script>
      // Defer analytics loading until user actually interacts
      var analyticsLoaded = false;
      var loadAnalytics = function() {
        if (analyticsLoaded) return;
        analyticsLoaded = true;
        
        // Additional delay even after interaction
        setTimeout(function() {
          var script = document.createElement('script');
          script.async = true;
          script.src = 'https://www.googletagmanager.com/gtag/js?id=G-JDCPS7ENJ6';
          document.head.appendChild(script);
          
          script.onload = function() {
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-JDCPS7ENJ6', {
              page_path: window.location.pathname
            });
            window.gtag = gtag;
          };
        }, 2000); // 2 second delay even after interaction
      };
      
      // Load on user interaction (scroll, click, touchstart, mousemove)
      ['scroll', 'click', 'touchstart', 'mousemove', 'keydown'].forEach(function(event) {
        window.addEventListener(event, loadAnalytics, { once: true, passive: true });
      });
      
      // Fallback: load after 10 seconds (much longer delay)
      setTimeout(loadAnalytics, 10000);
    </script>

  <body>
    <div id="root"></div>
    <script>
      // Single Page Apps for GitHub Pages
      // Restore the original URL from query parameter so React Router works correctly
      (function() {
        var l = window.location;
        var params = new URLSearchParams(l.search);
        var pathParam = params.get('p');
        
        if (pathParam) {
          var restoredPath = pathParam.startsWith('/') ? pathParam : '/' + pathParam;
          
          // Remove the 'p' parameter from URL
          params.delete('p');
          var newSearch = params.toString();
          var newUrl = restoredPath + (newSearch ? '?' + newSearch : '') + l.hash;
          
          // Restore the URL without reloading
          window.history.replaceState(null, null, newUrl);
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
